name: Test V3

on:
    push:
        branches:
            - v3
    schedule:
        - cron: '15 5 * * *'
    workflow_dispatch:

jobs:
    get-php-versions:
        name: Get PHP versions
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            latest: ${{ steps.set-matrix.outputs.latest }}
        steps:
            - name: Fetch PHP versions
              id: set-matrix
              run: |
                  response=$(curl -s https://php.watch/api/v1/versions/secure)
                  versions=$(echo "$response" | jq -r '.data | [.[] | .name] | sort_by(. | split(".") | map(tonumber)) | @json')
                  latest=$(echo "$versions" | jq -r '. | last')
                  echo "matrix=$versions" >> $GITHUB_OUTPUT
                  echo "latest=$latest" >> $GITHUB_OUTPUT

    test:
        runs-on: ubuntu-latest
        needs: get-php-versions

        strategy:
            matrix:
                php_version: ${{ fromJson(needs.get-php-versions.outputs.matrix) }}

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: v3

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php_version }}
                  tools: composer:v2
                  coverage: none

            - name: Run composer install
              run: composer install -n --prefer-dist

            - name: Run unit and functional tests
              run: |
                  php vendor/bin/phpunit --stop-on-failure
              env:
                  STORAGENAME: ${{ secrets.STORAGENAME }}
                  APIKEY: ${{ secrets.APIKEY }}